version: '3.8'
services:
  qa_db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: jenkin_nextjs
    ports:
      - "3306:3306"
    volumes:
      - qa_db_data:/var/lib/mysql_nextjs
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ppassword"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  qa_db_data:
